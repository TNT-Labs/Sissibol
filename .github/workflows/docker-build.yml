name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Controlli veloci senza Docker: lint, typecheck, build e test unitari.
  code-quality:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma client
      run: npm run prisma:generate --workspace=backend

    - name: Build backend
      run: npm run build --workspace=backend

    - name: Test backend
      run: npm test --workspace=backend

    - name: Lint frontend
      run: npm run lint --workspace=frontend

    - name: Build frontend (typecheck + bundle)
      run: npm run build --workspace=frontend

  build-and-test:
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Cache Docker layers
      uses: actions/cache@v3
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: Build Backend Image
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: false
        tags: sissibol-backend:test
        cache-from: type=local,src=/tmp/.buildx-cache
        cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

    - name: Build Frontend Image
      uses: docker/build-push-action@v4
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: false
        tags: sissibol-frontend:test
        build-args: |
          VITE_API_URL=http://localhost:3000
        cache-from: type=local,src=/tmp/.buildx-cache
        cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

    - name: Start services
      run: |
        docker-compose up -d
        sleep 30  # Wait for services to be ready

    - name: Check services health
      run: |
        docker-compose ps
        # /auth/login accetta solo POST: un 401/400 conferma comunque che il
        # backend risponde (200-499 = servizio raggiungibile).
        curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:3000/auth/login \
          -H "Content-Type: application/json" -d '{}' | grep -qE '^[24]' || exit 1
        curl -f http://localhost/ || exit 1

    - name: Show logs on failure
      if: failure()
      run: |
        docker-compose logs

    - name: Stop services
      if: always()
      run: docker-compose down -v

    - name: Move cache
      run: |
        rm -rf /tmp/.buildx-cache
        mv /tmp/.buildx-cache-new /tmp/.buildx-cache
