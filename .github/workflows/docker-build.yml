name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Controlli veloci senza Docker: lint, typecheck, build e test unitari.
  code-quality:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma client
      run: npm run prisma:generate --workspace=backend

    - name: Build backend
      run: npm run build --workspace=backend

    - name: Test backend (unit + golden master)
      run: npm test --workspace=backend

    - name: Lint frontend
      run: npm run lint --workspace=frontend

    - name: Build frontend (typecheck + bundle)
      run: npm run build --workspace=frontend

  # Test di integrazione su PostgreSQL reale: verificano le migrazioni da zero,
  # i filtri annidati, le transazioni e il locking ottimistico, che con un mock
  # di Prisma non sarebbero verificabili.
  integration-tests:
    runs-on: ubuntu-latest
    needs: code-quality

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: sissibol_test
          POSTGRES_PASSWORD: sissibol_test
          POSTGRES_DB: sissibol_test
        ports:
        - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sissibol_test -d sissibol_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL_TEST: postgresql://sissibol_test:sissibol_test@localhost:5432/sissibol_test?schema=public

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma client
      run: npm run prisma:generate --workspace=backend

    # Applica l'intera catena di migrazioni su uno schema vuoto: se una
    # migrazione non è applicabile da zero, il job fallisce qui.
    - name: Apply migrations from scratch
      run: npm run prisma:migrate:deploy --workspace=backend
      env:
        DATABASE_URL: ${{ env.DATABASE_URL_TEST }}

    - name: Seed check
      run: npm run prisma:seed --workspace=backend
      env:
        DATABASE_URL: ${{ env.DATABASE_URL_TEST }}

    - name: Integration tests
      run: npm run test:integration --workspace=backend

  build-and-test:
    runs-on: ubuntu-latest
    needs: [code-quality, integration-tests]

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Cache Docker layers
      uses: actions/cache@v5
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: Build Backend Image
      uses: docker/build-push-action@v7
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: false
        tags: sissibol-backend:test
        cache-from: type=local,src=/tmp/.buildx-cache
        cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

    - name: Build Frontend Image
      uses: docker/build-push-action@v7
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: false
        tags: sissibol-frontend:test
        build-args: |
          VITE_API_URL=http://localhost:3000
        cache-from: type=local,src=/tmp/.buildx-cache
        cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

    - name: Start services
      run: docker compose up -d

    - name: Check services health
      run: |
        # Il backend applica migrazioni e seed prima di avviarsi: si attende
        # finché risponde (al massimo 3 minuti) invece di un'attesa fissa.
        # /auth/login accetta solo POST: un 400/401 conferma comunque che il
        # backend risponde (200-499 = servizio raggiungibile).
        for i in $(seq 1 36); do
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:3000/auth/login \
            -H "Content-Type: application/json" -d '{}' || true)
          if echo "$code" | grep -qE '^[24]'; then echo "Backend pronto (HTTP $code)"; break; fi
          if [ "$i" -eq 36 ]; then echo "Backend non raggiungibile (ultimo HTTP $code)"; docker compose ps; exit 1; fi
          sleep 5
        done
        docker compose ps
        curl -fsS -o /dev/null http://localhost/ && echo "Frontend pronto"
        # Il percorso del browser: login attraverso nginx (/api) con Origin,
        # che il browser invia anche dalla stessa origine. Un rifiuto CORS
        # risponde 500; credenziali errate rispondono 401.
        code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost/api/auth/login \
          -H "Origin: http://localhost" -H "Content-Type: application/json" \
          -d '{"email":"verifica@example.com","password":"sbagliata"}')
        echo "Login via nginx: HTTP $code"
        [ "$code" = "401" ] || exit 1

    - name: Show logs on failure
      if: failure()
      run: |
        docker compose logs

    - name: Stop services
      if: always()
      run: docker compose down -v

    - name: Move cache
      run: |
        rm -rf /tmp/.buildx-cache
        mv /tmp/.buildx-cache-new /tmp/.buildx-cache
