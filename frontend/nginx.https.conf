# =============================================================================
# NGINX HTTPS Configuration for Sissibol PWA
# =============================================================================
# Security-hardened configuration for production deployment with SSL/TLS
# Compatible with DuckDNS + Let's Encrypt DNS Challenge (no port 80 required)
# =============================================================================

# Rate limiting zones (must be in http context, included via nginx.conf)
# These are defined in the main nginx.conf, not here

server {
    # HTTPS only - port 443 with HTTP/2
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    # Server name - will be replaced with actual DuckDNS domain
    server_name ${DOMAIN_NAME};

    # ==========================================================================
    # SSL/TLS Configuration - Strong Security Settings
    # ==========================================================================

    # Certificate paths (mounted via Docker volume)
    ssl_certificate /etc/letsencrypt/live/${DOMAIN_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN_NAME}/privkey.pem;

    # SSL session configuration
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Modern TLS configuration - TLS 1.2 and 1.3 only
    ssl_protocols TLSv1.2 TLSv1.3;

    # Strong cipher suites (Mozilla Modern configuration)
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # OCSP Stapling - improves SSL performance and privacy
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/${DOMAIN_NAME}/chain.pem;
    resolver 1.1.1.1 1.0.0.1 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Diffie-Hellman parameter for DHE ciphersuites
    ssl_dhparam /etc/nginx/ssl/dhparam.pem;

    # ==========================================================================
    # Security Headers - Comprehensive Protection
    # ==========================================================================

    # HTTP Strict Transport Security (HSTS) - force HTTPS for 2 years
    # includeSubDomains ensures all subdomains also use HTTPS
    # preload allows inclusion in browser HSTS preload lists
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Prevent clickjacking attacks
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # XSS Protection (legacy browsers)
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer Policy - limit information leakage
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions Policy - restrict browser features
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    # Content Security Policy - prevent XSS and data injection attacks
    # Adjusted for PWA requirements (service workers, manifest, etc.)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.duckdns.org; manifest-src 'self'; worker-src 'self'; frame-ancestors 'self';" always;

    # ==========================================================================
    # Root and Index
    # ==========================================================================

    root /usr/share/nginx/html;
    index index.html;

    # ==========================================================================
    # Gzip Compression
    # ==========================================================================

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/xml+rss application/json application/javascript image/svg+xml;

    # ==========================================================================
    # Request Size Limits - Prevent DoS
    # ==========================================================================

    client_max_body_size 10M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;

    # ==========================================================================
    # Timeouts - Prevent slow attacks
    # ==========================================================================

    client_body_timeout 12s;
    client_header_timeout 12s;
    keepalive_timeout 15s;
    send_timeout 10s;

    # ==========================================================================
    # Static Asset Caching
    # ==========================================================================

    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # CSS and JS with fingerprinted filenames
    location ~* \.(css|js)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ==========================================================================
    # PWA Files - No Cache
    # ==========================================================================

    location ~* (manifest\.webmanifest|sw\.js|workbox-.*\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # ==========================================================================
    # API Proxy to Backend
    # ==========================================================================

    location /api/ {
        # Rate limiting for API endpoints
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Forward client information
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Proxy timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_cache_bypass $http_upgrade;

        # Hide backend version headers
        proxy_hide_header X-Powered-By;
    }

    # ==========================================================================
    # Client-side Routing (SPA)
    # ==========================================================================

    location / {
        try_files $uri $uri/ /index.html;

        # Security headers for HTML
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ==========================================================================
    # Health Check Endpoint
    # ==========================================================================

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ==========================================================================
    # Block Sensitive Files
    # ==========================================================================

    # Block access to hidden files (except .well-known for ACME challenges)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block common backup/config files
    location ~* \.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist|env)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ==========================================================================
    # Error Pages
    # ==========================================================================

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
