# =============================================================================
# Main NGINX Configuration for Sissibol PWA (HTTPS)
# =============================================================================
# This file provides global settings including rate limiting
# =============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Security: limit information disclosure
server_tokens off;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format with security-relevant information
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Performance settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Security: hide nginx version
    server_tokens off;

    # ==========================================================================
    # Rate Limiting Zones
    # ==========================================================================

    # General rate limiting - 10 requests per second per IP
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;

    # API rate limiting - 5 requests per second per IP
    limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;

    # Login rate limiting - 1 request per 2 seconds per IP (prevent brute force)
    limit_req_zone $binary_remote_addr zone=login:10m rate=30r/m;

    # Connection limiting - max 10 connections per IP
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Rate limit response
    limit_req_status 429;
    limit_conn_status 429;

    # ==========================================================================
    # SSL Settings (global)
    # ==========================================================================

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Include server configurations
    include /etc/nginx/conf.d/*.conf;
}
