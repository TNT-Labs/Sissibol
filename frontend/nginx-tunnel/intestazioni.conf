# Intestazioni di sicurezza delle pagine dell'applicazione.
# nginx non eredita gli add_header del server nelle location che ne
# definiscono di propri: ogni location con add_header include questo file.

# Solo HTTPS per un anno. Senza includeSubDomains: sul dominio del negozio
# vale solo per questo host e non impone nulla agli altri sottodomini.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
# Solo codice servito da qui: niente script inline, eval o risorse esterne.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
