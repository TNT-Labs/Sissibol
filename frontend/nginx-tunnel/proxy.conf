# Inoltro al backend. L'IP del client (vedi 40-sissibol-origine.sh) sostituisce
# X-Forwarded-For, non vi si aggiunge: un valore inventato dal client non passa.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $sissibol_ip_cliente;
proxy_set_header X-Forwarded-For $sissibol_ip_cliente;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;
# Il segreto del Worker non serve al backend.
proxy_set_header X-Sissibol-Origine "";
proxy_set_header X-Sissibol-Client-IP "";

proxy_connect_timeout 10s;
proxy_send_timeout 60s;
proxy_read_timeout 120s;

proxy_hide_header X-Powered-By;
# L'HSTS del backend include i sottodomini: qui vale quella senza.
proxy_hide_header Strict-Transport-Security;
add_header Strict-Transport-Security "max-age=31536000" always;
# Dati dei clienti: mai in cache intermedie (Cloudflare compresa).
add_header Cache-Control "no-store" always;
