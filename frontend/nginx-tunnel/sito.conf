# =============================================================================
# Sissibol dietro Cloudflare Tunnel: interfaccia e API sotto /bolli
# =============================================================================
# Incluso da conf.d/sissibol.conf (generato da 40-sissibol-origine.sh), che
# definisce $sissibol_ip_cliente e $sissibol_origine_ammessa.
# Nessuna porta è pubblicata: raggiungibile solo da cloudflared.
# =============================================================================

# Registro senza query string (può contenere targhe o nomi cercati).
log_format sissibol '$sissibol_ip_cliente [$time_local] "$request_method $uri" '
                    '$status $body_bytes_sent $request_time "$http_user_agent"';

# Limiti per singolo client (non per cloudflared, che è uno solo per tutti).
limit_req_zone $sissibol_ip_cliente zone=sissibol_api:10m rate=20r/s;
limit_req_zone $sissibol_ip_cliente zone=sissibol_login:10m rate=10r/m;
limit_conn_zone $sissibol_ip_cliente zone=sissibol_conn:10m;

# DNS interno di Docker: se il backend viene ricreato (aggiornamento) e cambia
# IP, nginx lo segue senza riavvio invece di rispondere 502.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream sissibol_backend {
    zone sissibol_backend 64k;
    server backend:3000 resolve;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;

    server_tokens off;
    # Redirect relativi: nginx non conosce il dominio pubblico né lo schema.
    absolute_redirect off;
    access_log /var/log/nginx/access.log sissibol;

    root /usr/share/nginx/html;

    client_max_body_size 6m;          # ricevute fino a 5 MB
    client_body_timeout 30s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 30s;

    limit_conn sissibol_conn 50;
    limit_req_status 429;
    limit_conn_status 429;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/manifest+json image/svg+xml;

    include /etc/nginx/sissibol/intestazioni.conf;

    # Con il Worker, solo le richieste che portano il suo segreto.
    if ($sissibol_origine_ammessa = 0) {
        return 403;
    }

    # Su un sottodominio dedicato, la radice porta all'applicazione.
    location = / {
        return 302 /bolli/;
    }

    # Qualsiasi altro percorso non esiste.
    location / {
        return 404;
    }

    location = /bolli {
        return 301 /bolli/;
    }

    # Applicazione a pagina singola: i percorsi sconosciuti servono index.html.
    location /bolli/ {
        try_files $uri /bolli/index.html;
    }

    # index.html e service worker sempre rivalidati: un aggiornamento arriva
    # subito a tutti.
    location = /bolli/index.html {
        include /etc/nginx/sissibol/intestazioni.conf;
        add_header Cache-Control "no-store" always;
    }

    location ~ ^/bolli/(sw\.js|manifest\.webmanifest|registerSW\.js|workbox-[A-Za-z0-9_-]+\.js)$ {
        include /etc/nginx/sissibol/intestazioni.conf;
        add_header Cache-Control "no-cache" always;
        # mime.types di nginx non conosce l'estensione del manifest.
        types {
            application/javascript js;
            application/manifest+json webmanifest;
        }
        try_files $uri =404;
    }

    # File con impronta nel nome: in cache a lungo. Un file mancante è un 404,
    # non la pagina dell'applicazione.
    location /bolli/assets/ {
        include /etc/nginx/sissibol/intestazioni.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # API: /bolli/api/clienti -> backend /clienti
    location /bolli/api/ {
        limit_req zone=sissibol_api burst=60 nodelay;
        include /etc/nginx/sissibol/proxy.conf;
        proxy_pass http://sissibol_backend/;
    }

    # Login: limite più stretto contro i tentativi a raffica, oltre al blocco
    # dell'utente dopo 5 errori applicato dal backend.
    location = /bolli/api/auth/login {
        limit_req zone=sissibol_login burst=5 nodelay;
        include /etc/nginx/sissibol/proxy.conf;
        proxy_pass http://sissibol_backend/auth/login;
    }

    # File nascosti o di configurazione, per sicurezza.
    location ~ /\. {
        return 404;
    }
}

# Controllo di salute del container, raggiungibile solo dall'interno.
server {
    listen 127.0.0.1:8081;
    access_log off;
    location / {
        return 200 "ok\n";
    }
}
