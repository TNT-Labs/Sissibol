# =============================================================================
# Docker Compose - HTTPS Production Deployment
# =============================================================================
# Secure deployment with Let's Encrypt SSL certificates via DuckDNS DNS Challenge
# No port 80 required - uses DNS-01 challenge for certificate validation
# =============================================================================
#
# Prerequisites:
#   1. Create a DuckDNS account and domain at https://www.duckdns.org
#   2. Copy .env.https.example to .env and configure your settings
#   3. Run the initial certificate generation:
#      ./scripts/ssl/init-ssl.sh
#   4. Start the stack:
#      docker compose -f docker-compose.https.yml up -d
#
# =============================================================================

# Log a rotazione: senza limiti i log dei container riempiono il disco in mesi.
x-log: &log
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # ===========================================================================
  # PostgreSQL Database
  # ===========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: sissibol-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sissibol}
      POSTGRES_USER: ${POSTGRES_USER:-sissibol_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Security: Do NOT expose database port externally
    # Only accessible via internal network
    networks:
      - sissibol-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sissibol_user} -d ${POSTGRES_DB:-sissibol}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Security: read-only root filesystem where possible
    security_opt:
      - no-new-privileges:true
    logging: *log

  # ===========================================================================
  # Backend API (NestJS)
  # ===========================================================================
  backend:
    build:
      # Contesto: la radice del monorepo, per le build dal package-lock.json.
      context: .
      dockerfile: backend/Dockerfile
    container_name: sissibol-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sissibol_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sissibol}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT secret is required}
      PORT: 3000
      NODE_ENV: production
      # Trust proxy headers from nginx
      TRUST_PROXY: "true"
      # Cookie di sessione solo in HTTPS e solo sulle rotte di autenticazione
      COOKIE_PATH: /api/auth
      COOKIE_SECURE: "true"
      # Password del primo amministratore; se assente se ne genera una casuale,
      # mostrata una sola volta nei log del backend.
      ADMIN_PASSWORD_INIZIALE: ${ADMIN_PASSWORD_INIZIALE:-}
      # Stato dei backup, mostrato agli amministratori nella dashboard
      BACKUP_STATO_FILE: /backups/stato.json
      # Origini esterne ammesse dal CORS (la stessa origine lo è sempre)
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      APP_FUSO_ORARIO: ${APP_FUSO_ORARIO:-Europe/Rome}
      # Server di posta: senza SMTP_HOST nessuna email parte
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Riepilogo interno giornaliero allo studio
      NOTIFICHE_EMAIL_TO: ${NOTIFICHE_EMAIL_TO:-}
      NOTIFICHE_GIORNI_ANTICIPO: ${NOTIFICHE_GIORNI_ANTICIPO:-30}
      NOTIFICHE_ORA: ${NOTIFICHE_ORA:-07:00}
      # Avvisi ai clienti (vedi AVVISI.md)
      AVVISI_INVIO_AUTOMATICO: ${AVVISI_INVIO_AUTOMATICO:-false}
      AVVISI_ORA: ${AVVISI_ORA:-09:00}
      AVVISI_MAX_EMAIL_PER_ESECUZIONE: ${AVVISI_MAX_EMAIL_PER_ESECUZIONE:-200}
      AVVISI_FIRMA: ${AVVISI_FIRMA:-}
      AVVISI_RISPONDI_A: ${AVVISI_RISPONDI_A:-}
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./backups:/backups:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sissibol-internal
      # Solo in uscita, per il server di posta (avvisi e riepilogo): nessuna
      # porta è pubblicata, quindi da fuori il backend resta irraggiungibile.
      - sissibol-external
    # Security: Do NOT expose backend port externally
    # Only accessible via internal network through nginx
    security_opt:
      - no-new-privileges:true
    # Resource limits to prevent DoS
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging: *log

  # ===========================================================================
  # Frontend (React + Nginx HTTPS)
  # ===========================================================================
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.https
      args:
        VITE_API_URL: /api
        DOMAIN_NAME: ${DUCKDNS_SUBDOMAIN}.duckdns.org
    container_name: sissibol-frontend
    restart: unless-stopped
    ports:
      # HTTPS only - no port 80 exposed
      - "443:443"
    environment:
      DOMAIN_NAME: ${DUCKDNS_SUBDOMAIN}.duckdns.org
    volumes:
      # Certificati Let's Encrypt: la stessa cartella in cui li scrive
      # scripts/ssl/init-ssl.sh (prima era un volume Docker diverso, vuoto,
      # e nginx non trovava i certificati).
      - ./letsencrypt:/etc/letsencrypt:ro
      # DH parameters
      - ./ssl/dhparam.pem:/etc/nginx/ssl/dhparam.pem:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sissibol-internal
      - sissibol-external
    security_opt:
      - no-new-privileges:true
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging: *log

  # ===========================================================================
  # Certbot - Certificate Management
  # ===========================================================================
  # This container handles certificate renewal automatically
  # Uses DNS-01 challenge via DuckDNS API (no port 80 needed)
  certbot:
    image: certbot/certbot:latest
    container_name: sissibol-certbot
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      # Hook DuckDNS: certbot salva nella configurazione di rinnovo il
      # percorso /hooks usato alla prima emissione, quindi devono essere qui.
      - ./scripts/ssl/hooks:/hooks:ro
    environment:
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN:?DuckDNS token is required}
      DUCKDNS_SUBDOMAIN: ${DUCKDNS_SUBDOMAIN:?DuckDNS subdomain is required}
      CERT_EMAIL: ${CERT_EMAIL:?Email for certificate notifications is required}
    # Verifica il rinnovo due volte al giorno (certbot rinnova solo a meno di
    # 30 giorni dalla scadenza). Il file segnale fa ricaricare nginx.
    entrypoint: "/bin/sh"
    command: >
      -c 'trap exit TERM; while :; do
        certbot renew --deploy-hook "touch /etc/letsencrypt/renewal-complete";
        sleep 12h & wait $${!};
      done'
    networks:
      # Deve raggiungere Let's Encrypt e DuckDNS: la rete interna è isolata.
      - sissibol-external
    depends_on:
      - frontend
    security_opt:
      - no-new-privileges:true
    logging: *log

  # ===========================================================================
  # Backup giornaliero del database e delle ricevute (vedi BACKUP.md)
  # ===========================================================================
  backup:
    image: postgres:15-alpine
    container_name: sissibol-backup
    restart: unless-stopped
    entrypoint: ["sh", "/script/backup.sh", "ciclo"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-sissibol_user}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-sissibol}
      TZ: ${APP_FUSO_ORARIO:-Europe/Rome}
      BACKUP_ORA: ${BACKUP_ORA:-02:30}
      BACKUP_GIORNI: ${BACKUP_GIORNI:-14}
      BACKUP_MESI: ${BACKUP_MESI:-12}
    volumes:
      - ./backups:/backups
      - ./backend/uploads:/uploads:ro
      - ./scripts/backup:/script:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sissibol-internal
    security_opt:
      - no-new-privileges:true
    logging: *log

# ===========================================================================
# Volumes
# ===========================================================================
volumes:
  postgres_data:
    driver: local

# ===========================================================================
# Networks
# ===========================================================================
networks:
  # Rete interna, senza accesso a Internet: database e comunicazioni fra servizi
  sissibol-internal:
    driver: bridge
    internal: true
  # Rete con accesso a Internet: la porta 443 del frontend e le connessioni in
  # uscita di backend (posta) e certbot (Let's Encrypt, DuckDNS)
  sissibol-external:
    driver: bridge
