# =============================================================================
# Docker Compose - installazione HTTP (rete locale)
# =============================================================================
# Per un'installazione raggiungibile da Internet usare docker-compose.https.yml.
#
# Prima dell'avvio: copiare .env.example in .env e impostare almeno JWT_SECRET.
#   docker compose up -d --build
# =============================================================================

# Log a rotazione: senza limiti i log dei container riempiono il disco in mesi.
x-log: &log
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: sissibol-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sissibol}
      POSTGRES_USER: ${POSTGRES_USER:-sissibol_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sissibol_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Solo dal computer che ospita l'applicazione (strumenti di amministrazione),
      # mai dalla rete.
      - "127.0.0.1:5432:5432"
    networks:
      - sissibol-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sissibol_user} -d ${POSTGRES_DB:-sissibol}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *log

  # Backend API (NestJS)
  backend:
    build:
      # Contesto: la radice del monorepo, per le build dal package-lock.json.
      context: .
      dockerfile: backend/Dockerfile
    container_name: sissibol-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sissibol_user}:${POSTGRES_PASSWORD:-sissibol_password}@postgres:5432/${POSTGRES_DB:-sissibol}?schema=public
      # Obbligatoria: con un valore noto chiunque potrebbe firmare token validi.
      # Generarla con: openssl rand -base64 48
      JWT_SECRET: ${JWT_SECRET:?Impostare JWT_SECRET nel file .env (openssl rand -base64 48)}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-24h}
      PORT: 3000
      NODE_ENV: production
      # Dietro nginx: l'IP del client arriva in X-Forwarded-For (limiti dei
      # tentativi per singolo client, non condivisi da tutti).
      TRUST_PROXY: "true"
      # Cookie di sessione limitato alle rotte di autenticazione. Secure solo
      # se l'applicazione è servita in HTTPS: su http:// in rete locale il
      # browser scarterebbe il cookie e la sessione durerebbe 15 minuti.
      COOKIE_PATH: /api/auth
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Password del primo amministratore; se assente se ne genera una casuale,
      # mostrata una sola volta nei log del backend.
      ADMIN_PASSWORD_INIZIALE: ${ADMIN_PASSWORD_INIZIALE:-}
      # Stato dei backup, mostrato agli amministratori nella dashboard
      BACKUP_STATO_FILE: /backups/stato.json
      # Origini esterne ammesse dal CORS (la stessa origine lo è sempre)
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      APP_FUSO_ORARIO: ${APP_FUSO_ORARIO:-Europe/Rome}
      # Server di posta: senza SMTP_HOST nessuna email parte
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Riepilogo interno giornaliero allo studio
      NOTIFICHE_EMAIL_TO: ${NOTIFICHE_EMAIL_TO:-}
      NOTIFICHE_GIORNI_ANTICIPO: ${NOTIFICHE_GIORNI_ANTICIPO:-30}
      NOTIFICHE_ORA: ${NOTIFICHE_ORA:-07:00}
      # Avvisi ai clienti (vedi AVVISI.md)
      AVVISI_INVIO_AUTOMATICO: ${AVVISI_INVIO_AUTOMATICO:-false}
      AVVISI_ORA: ${AVVISI_ORA:-09:00}
      AVVISI_MAX_EMAIL_PER_ESECUZIONE: ${AVVISI_MAX_EMAIL_PER_ESECUZIONE:-200}
      AVVISI_FIRMA: ${AVVISI_FIRMA:-}
      AVVISI_RISPONDI_A: ${AVVISI_RISPONDI_A:-}
    ports:
      # API raggiungibile direttamente solo da questo computer; dalla rete
      # passa dal frontend (/api).
      - "127.0.0.1:3000:3000"
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./import/csv:/app/import/csv
      - ./backups:/backups:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sissibol-network
    logging: *log

  # Frontend (React + Vite)
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api
    container_name: sissibol-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sissibol-network
    logging: *log

  # Backup giornaliero del database e delle ricevute (vedi BACKUP.md)
  backup:
    image: postgres:15-alpine
    container_name: sissibol-backup
    restart: unless-stopped
    entrypoint: ["sh", "/script/backup.sh", "ciclo"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-sissibol_user}
      PGPASSWORD: ${POSTGRES_PASSWORD:-sissibol_password}
      PGDATABASE: ${POSTGRES_DB:-sissibol}
      TZ: ${APP_FUSO_ORARIO:-Europe/Rome}
      BACKUP_ORA: ${BACKUP_ORA:-02:30}
      BACKUP_GIORNI: ${BACKUP_GIORNI:-14}
      BACKUP_MESI: ${BACKUP_MESI:-12}
    volumes:
      - ./backups:/backups
      - ./backend/uploads:/uploads:ro
      - ./scripts/backup:/script:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sissibol-network
    logging: *log

volumes:
  postgres_data:
    driver: local

networks:
  sissibol-network:
    driver: bridge
