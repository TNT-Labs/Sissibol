services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: sissibol-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sissibol
      POSTGRES_USER: sissibol_user
      POSTGRES_PASSWORD: sissibol_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - sissibol-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sissibol_user -d sissibol"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (NestJS)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sissibol-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://sissibol_user:sissibol_password@postgres:5432/sissibol?schema=public
      JWT_SECRET: your-production-secret-key-change-me
      JWT_EXPIRATION: 24h
      PORT: 3000
      NODE_ENV: production
      # Origini esterne ammesse dal CORS (la stessa origine lo è sempre)
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      APP_FUSO_ORARIO: ${APP_FUSO_ORARIO:-Europe/Rome}
      # Server di posta: senza SMTP_HOST nessuna email parte
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Riepilogo interno giornaliero allo studio
      NOTIFICHE_EMAIL_TO: ${NOTIFICHE_EMAIL_TO:-}
      NOTIFICHE_GIORNI_ANTICIPO: ${NOTIFICHE_GIORNI_ANTICIPO:-30}
      NOTIFICHE_ORA: ${NOTIFICHE_ORA:-07:00}
      # Avvisi ai clienti (vedi AVVISI.md)
      AVVISI_INVIO_AUTOMATICO: ${AVVISI_INVIO_AUTOMATICO:-false}
      AVVISI_ORA: ${AVVISI_ORA:-09:00}
      AVVISI_MAX_EMAIL_PER_ESECUZIONE: ${AVVISI_MAX_EMAIL_PER_ESECUZIONE:-200}
      AVVISI_FIRMA: ${AVVISI_FIRMA:-}
      AVVISI_RISPONDI_A: ${AVVISI_RISPONDI_A:-}
    ports:
      - "3000:3000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./import/csv:/app/import/csv
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sissibol-network

  # Frontend (React + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: sissibol-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - sissibol-network

volumes:
  postgres_data:
    driver: local

networks:
  sissibol-network:
    driver: bridge
